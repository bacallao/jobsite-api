version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: nest_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: jobsite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

